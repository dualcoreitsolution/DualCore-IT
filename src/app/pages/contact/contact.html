<section class="contact" data-aos="fade-up" data-aos-delay="100">
  <div class="container py-5">
    <div class="section-title text-center mb-5">
      <h2 class="display-4 fw-bold text-primary">Get in Touch</h2>
      <p class="lead text-muted">We're here to help and answer any questions you might have</p>
    </div>

    <div class="row g-5">
      <!-- Contact Information -->
      <div class="col-lg-4">
        <div class="contact-info bg-light rounded p-4 h-100 shadow-sm">
          <div class="mb-4">
            <h3 class="h5 text-primary"><i class="bi bi-geo-alt me-2"></i>Visit Us</h3>
            <p class="mb-0">Pune, Maharashtra 411045</p>
          </div>
          <div class="mb-4">
            <h3 class="h5 text-primary"><i class="bi bi-telephone me-2"></i>Call Us</h3>
            <p class="mb-0">+91 766378565/+91 8459633937</p>
            <p>Mon - Fri, 9am - 6pm</p>
          </div>
          <div class="mb-4">
            <h3 class="h5 text-primary"><i class="bi bi-envelope me-2"></i>Email Us</h3>
            <p class="mb-0">dualcoreitsolution@gmail.com</p>
          </div>
          <div class="social-links mt-4">
            <a href="#" class="twitter me-2"><i class="bi bi-twitter fs-5"></i></a>
            <a href="#" class="facebook me-2"><i class="bi bi-facebook fs-5"></i></a>
            <a href="#" class="instagram me-2"><i class="bi bi-instagram fs-5"></i></a>
            <a href="#" class="linkedin"><i class="bi bi-linkedin fs-5"></i></a>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="col-lg-8">
        <div class="bg-white rounded p-4 h-100 shadow-sm">
          <form class="row g-3">
            <div class="col-md-6">
              <label for="name" class="form-label">Your Name</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="col-12">
              <label for="subject" class="form-label">Subject</label>
              <input type="text" class="form-control" id="subject" required>
            </div>
            <div class="col-12">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="5" required></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary btn-lg px-5">
                <i class="bi bi-send me-2"></i>Send Message
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

</div>
